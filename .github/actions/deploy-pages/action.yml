name: Deploy GitHub Pages site with extended wait
description: Vendored GitHub deploy-pages action with a 30-minute queue timeout
author: GitHub, timeout adjustment by repository maintainers
runs:
  using: node24
  main: dist/index.js
inputs:
  token:
    description: GitHub token
    default: ${{ github.token }}
    required: true
  timeout:
    description: Time in milliseconds after which to timeout and cancel the deployment
    required: false
    default: "1800000"
  error_count:
    description: Maximum number of status report errors before cancelling a deployment
    required: false
    default: "20"
  reporting_interval:
    description: Time in milliseconds between deployment status reports
    required: false
    default: "5000"
  artifact_name:
    description: Name of the artifact to deploy
    required: false
    default: github-pages
  preview:
    description: Whether this is a Pages preview deployment
    required: false
    default: "false"
outputs:
  page_url:
    description: URL of the deployed GitHub Pages site
